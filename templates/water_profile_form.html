<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if profile %}Editar Perfil{% else %}Nuevo Perfil{% endif %} - Brewing Calc</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f6f8; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .section-title { border-bottom: 2px solid #3498db; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; color: #34495e; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 10px 20px; border-radius: 5px; color: white; text-decoration: none; border: none; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2ecc71; }
        .btn-cancel { background: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if profile %}💧 Editar Perfil: {{ profile.name }}{% else %}💧 Nuevo Perfil de Agua{% endif %}</h1>
        
        <form id="waterProfileForm">
            <input type="hidden" id="profile_id" value="{{ profile.id if profile else '' }}">

            <div class="grid-2">
                <div class="form-group">
                    <label>Nombre del Perfil *</label>
                    <input type="text" id="name" value="{{ profile.name if profile else '' }}" required placeholder="Ej: Agua Local Rosario / Burton on Trent">
                </div>
                <div class="form-group">
                    <label>pH Base del Agua</label>
                    <input type="number" step="0.1" id="ph_base" value="{{ profile.ph_base if profile else 7.0 }}">
                </div>
            </div>

            <h3 class="section-title">Concentración de Minerales (PPM / mg/L)</h3>
            <div class="grid-3">
                <div class="form-group">
                    <label>Calcio (Ca²⁺)</label>
                    <input type="number" step="0.1" id="ca" value="{{ profile.ca if profile else 0 }}">
                </div>
                <div class="form-group">
                    <label>Magnesio (Mg²⁺)</label>
                    <input type="number" step="0.1" id="mg" value="{{ profile.mg if profile else 0 }}">
                </div>
                <div class="form-group">
                    <label>Sodio (Na⁺)</label>
                    <input type="number" step="0.1" id="na" value="{{ profile.na if profile else 0 }}">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label>Sulfato (SO₄²⁻)</label>
                    <input type="number" step="0.1" id="so4" value="{{ profile.so4 if profile else 0 }}">
                </div>
                <div class="form-group">
                    <label>Cloruro (Cl⁻)</label>
                    <input type="number" step="0.1" id="cl" value="{{ profile.cl if profile else 0 }}">
                </div>
                <div class="form-group">
                    <label>Bicarbonato (HCO₃⁻)</label>
                    <input type="number" step="0.1" id="hco3" value="{{ profile.hco3 if profile else 0 }}">
                </div>
            </div>

            <h3 class="section-title">Observaciones</h3>
            <div class="form-group">
                <textarea id="notes" rows="3" placeholder="Información sobre la fuente de agua, método de filtración (Ósmosis/Filtro Carbón)...">{{ profile.notes if profile else '' }}</textarea>
            </div>

            <div class="btn-group">
                <a href="/tables" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Perfil</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('waterProfileForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                id: document.getElementById('profile_id').value,
                name: document.getElementById('name').value,
                ph_base: parseFloat(document.getElementById('ph_base').value) || 7.0,
                ca: parseFloat(document.getElementById('ca').value) || 0,
                mg: parseFloat(document.getElementById('mg').value) || 0,
                na: parseFloat(document.getElementById('na').value) || 0,
                so4: parseFloat(document.getElementById('so4').value) || 0,
                cl: parseFloat(document.getElementById('cl').value) || 0,
                hco3: parseFloat(document.getElementById('hco3').value) || 0,
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/tables/water/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();
                if (response.ok && resData.status === 'ok') {
                    window.location.href = resData.redirect_url;
                } else {
                    alert('Error al guardar el perfil: ' + (resData.message || 'Error desconocido'));
                }
            } catch (err) {
                alert('Error de red al conectar con el servidor.');
                console.error(err);
            }
        });
    </script>
</body>
</html>
